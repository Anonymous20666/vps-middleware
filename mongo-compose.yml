version: '3.8'
services:
  mongodb:
    image: mongo:latest
    container_name: omega_db
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: OmegaDatabasePassword2026!
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
